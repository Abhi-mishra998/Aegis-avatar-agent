[project]
name = "bytehubble-track-b-pipecat"
version = "0.1.0"
description = "ByteHubble Founder Avatar — Pipecat composable agent (STT → LLM-with-fallback → TTS → Simli avatar)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pipecat-ai[anthropic,cartesia,daily,deepgram,elevenlabs,groq,openai,runner,silero,simli,webrtc]",
    "pipecatcloud",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
